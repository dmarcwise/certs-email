name: Deploy
run-name: Deploy to ${{ inputs.deploy_target }} (${{ github.sha }})

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target'
        required: true
        default: 'PROD'
        type: choice
        options:
          - PROD

jobs:
  PROD-build-and-push:
    name: '[PROD] Build and push'
    runs-on: ubuntu-latest
    if: inputs.deploy_target == 'PROD'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          push: true
          tags: 'ghcr.io/${{ github.repository }}:${{ github.sha }}'
  PROD-deploy:
    name: '[PROD] Deploy'
    runs-on: ubuntu-latest
    if: inputs.deploy_target == 'PROD'
    needs: PROD-build-and-push
    permissions:
      contents: read
      id-token: write
    env:
      SERVER: dmw-prod-1.taild99d78.ts.net
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Connect to tailnet
        uses: tailscale/github-action@v4.3.0
        with:
          # Federated identity:
          # - Subject: repo:dmarcwise@175476939/certs-email@1122347473:ref:refs/heads/main
          # - Scope: auth_keys
          # - Tag: tag:ci
          oauth-client-id: ${{ vars.TS_DEPLOY_CLIENT_ID }}
          audience: ${{ vars.TS_DEPLOY_AUDIENCE }}
          tags: tag:ci
          # Wait until the server accepts connections from this new node
          ping: ${{ env.SERVER }}
      - name: Prepare deploy
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ vars.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          echo "${{ secrets.DEPLOY_PRIVATE_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/*
      - name: Deploy
        env:
          COMPOSE_SOURCE_PATH: docker-compose.yml
          COMPOSE_DESTINATION_PATH: /tmp/certs-email.yml
        run: |
          set -euo pipefail
          scp -i ~/.ssh/key $COMPOSE_SOURCE_PATH deploy@$SERVER:$COMPOSE_DESTINATION_PATH
          ssh deploy@$SERVER \
            -i ~/.ssh/key \
            COMPOSE_FILE_PATH=$COMPOSE_DESTINATION_PATH \
            OP_CONNECT_TOKEN=${{ secrets.OP_CONNECT_TOKEN }} \
            DOCKER_REGISTRY_NAME=ghcr.io \
            DOCKER_REGISTRY_USERNAME=dmw-bot \
            DOCKER_IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }} \
            'bash -s' < .github/workflows/deploy.sh
